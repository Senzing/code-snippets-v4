name: python windows snippets

on:
  pull_request:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  sdk-versions:
    runs-on: ubuntu-latest
    outputs:
      senzingsdk-versions: ${{ steps.cfg.outputs.senzingsdk-versions }}
    steps:
      - id: cfg
        uses: senzing-factory/build-resources/sdk-versions@v4

  python-windows-snippets:
    needs: sdk-versions
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        senzingsdk-version: ${{ fromJSON(needs.sdk-versions.outputs.senzingsdk-versions) }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test

      - name: Mint staging bucket token
        if: matrix.senzingsdk-version != 'production-v4'
        id: staging-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.SENZINGSDK_STAGING_CLIENT_ID }}
          private-key: ${{ secrets.SENZINGSDK_STAGING_APP_KEY }}
          owner: senzing-factory # zizmor: ignore[github-app]
          repositories: scoop-senzingsdk-staging
          permission-contents: read

      - name: install Senzing SDK
        uses: senzing-factory/github-action-install-senzing-sdk@v5
        with:
          senzingsdk-version: ${{ matrix.senzingsdk-version }}
          senzingsdk-token: ${{ steps.staging-token.outputs.token || github.token }}

      - name: configure environment
        run: |
          Add-Content $env:GITHUB_PATH "$Env:USERPROFILE\senzing\er\lib"
          Add-Content $env:GITHUB_ENV "PYTHONPATH=$Env:USERPROFILE\senzing\er\sdk\python"

      - name: run python snippets
        run: |
          python -m pytest -rs

      - name: Notify Slack on failure
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: senzing-factory/build-resources/slack-failure-notification@v4
        with:
          job-status: ${{ job.status }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          additional-info: "SDK: ${{ matrix.senzingsdk-version }}, Python: ${{ matrix.python-version }}"
