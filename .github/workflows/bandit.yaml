name: Bandit

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  bandit:
    permissions:
      security-events: write
    # PyCQA/bandit-action@v1.0.1 always installs Python 3.9, which ubuntu-26.04 does not provide
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    timeout-minutes: 10

    steps:
      - name: Run Bandit Scan
        uses: PyCQA/bandit-action@v1.0.1
        with:
          python-version: ${{ matrix.python-version }}
          configfile: pyproject.toml
          targets: python
